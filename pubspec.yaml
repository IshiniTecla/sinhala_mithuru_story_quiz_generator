name: game_frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Aligned with 'flutter' (2 spaces indentation)
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^1.0.8

  #supbase

  supabase_flutter: ^2.0.0

  # 1. API Connection
  http: ^1.2.0

  # 2. State Management
  provider: ^6.1.1

  # 3. Speaking Feature
  flutter_tts: ^4.2.4
  speech_to_text: ^7.3.0

  # 4. Writing Feature
  flutter_drawing_board: ^1.0.1

  # 5. UI & Responsiveness
  google_fonts: ^6.1.0
  flutter_staggered_grid_view: ^0.7.0

  # 6. New UI & Sound Features
  lottie: ^3.1.0
  audioplayers: ^6.5.1
  clay_containers: ^0.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets Folder
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
